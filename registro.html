  
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | GIF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>GIF</h1>
    <h2>Crear una cuenta</h2>

    <form id="registro">
      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button type="submit">Crear cuenta</button>
    </form>

    <p id="mensaje" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://cldweafkjdjsqliymhtp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cAro2nAAzZEUALPkvKTjow_V5UKoGMK";

    const cliente = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formulario = document.getElementById("registro");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      mensaje.textContent = "Procesando registro...";

      const { error } = await cliente.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: "https://gifarch.com/"
        }
      });

      if (error) {
        mensaje.textContent = "Error: " + error.message;
      } else {
        mensaje.textContent =
          "Revisa tu correo para confirmar tu cuenta.";
        formulario.reset();
      }
    });
  </script>

</body>
</html>
