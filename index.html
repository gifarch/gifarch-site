
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>GIF</h1>
    <p>Academia · Investigación · Proyectos</p>

    <div id="usuario">
      Comprobando sesión...
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://cldweafkjdjsqliymhtp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cAro2nAAzZEUALPkvKTjow_V5UKoGMK";

    const cliente = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const contenedor = document.getElementById("usuario");

    async function comprobarSesion() {
      const { data, error } = await cliente.auth.getUser();

      if (error || !data.user) {
        contenedor.innerHTML = `
          <a href="/login">Iniciar sesión</a>
          <a href="/registro">Registrarse</a>
        `;
      } else {
        const usuario = data.user;

        contenedor.replaceChildren();

        const saludo = document.createElement("p");
        saludo.textContent = "Conectado como: " + usuario.email;

        const boton = document.createElement("button");
        boton.textContent = "Cerrar sesión";
        boton.addEventListener("click", cerrarSesion);

        contenedor.append(saludo, boton);
      }
    }

    async function cerrarSesion() {
      const { error } = await cliente.auth.signOut();

      if (error) {
        alert("No se pudo cerrar sesión: " + error.message);
        return;
      }

      await comprobarSesion();
    }

    comprobarSesion();
  </script>

</body>
</html>
