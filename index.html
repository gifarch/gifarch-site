
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>GIF</h1>
    <p>Academia · Investigación · Proyectos</p>

    <div id="usuario">
      Comprobando sesión...
    </div>

    <section>
      <h2>Últimas publicaciones</h2>
      <div id="publicaciones">
        Cargando publicaciones...
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const cliente = supabase.createClient(
      "https://cldweafkjdjsqliymhtp.supabase.co",
      "sb_publishable_cAro2nAAzZEUALPkvKTjow_V5UKoGMK"
    );

    const contenedor = document.getElementById("usuario");

    async function comprobarSesion() {
      const { data, error } = await cliente.auth.getUser();

      if (error || !data.user) {
        contenedor.innerHTML = `
          <a href="/login">Iniciar sesión</a>
          <a href="/registro">Registrarse</a>
        `;
      } else {
        contenedor.replaceChildren();

        const saludo = document.createElement("p");
        saludo.textContent =
          "Conectado como: " + data.user.email;

        const boton = document.createElement("button");
        boton.textContent = "Cerrar sesión";
        boton.addEventListener("click", cerrarSesion);

        contenedor.append(saludo, boton);
      }
    }

    async function cerrarSesion() {
      const { error } = await cliente.auth.signOut();

      if (error) {
        alert("Error: " + error.message);
        return;
      }

      await comprobarSesion();
    }

    async function cargarPublicaciones() {
      const contenedor =
        document.getElementById("publicaciones");

      const { data, error } = await cliente
        .from("articles")
        .select("id, title, created_at")
        .eq("status", "published")
        .order("created_at", { ascending: false });

      if (error) {
        contenedor.textContent =
          "Error al cargar publicaciones: " + error.message;
        return;
      }

      contenedor.replaceChildren();

      if (data.length === 0) {
        contenedor.textContent =
          "Todavía no hay publicaciones.";
        return;
      }

      for (const articulo of data) {
        const enlace = document.createElement("a");

        enlace.href =
          "/articulo?id=" + encodeURIComponent(articulo.id);

        enlace.textContent = articulo.title;

        const bloque = document.createElement("p");
        bloque.appendChild(enlace);

        contenedor.appendChild(bloque);
      }
    }

    comprobarSesion();
    cargarPublicaciones();
  </script>

</body>
</html>
